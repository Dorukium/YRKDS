[project]
name = "yrkds"
version = "4.0.0"
description = "Antalya Yatirim Riski Karar Destek Sistemi"
readme = "README.md"
# Kilitli veri kaynaklarinin wheel uyumsuzlugunu onlemek icin 3.12 sabitlendi.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.7",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "polars>=1.12",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.16",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "weasyprint>=63",
    "cdsapi>=0.7",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6", "httpx>=0.28", "mypy>=1.13", "pip-audit>=2.7",
    "cyclonedx-bom>=5", "alembic>=1.14", "redis>=5", "types-requests>=2.32",
    "prometheus-client>=0.21",
    "argon2-cffi>=23.2",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "pypdf>=5.0",
    "SALib>=1.5",
    "earthaccess>=0.14",
    "xarray>=2024.10",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "earthengine-api>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Turkce characters (ı, ş, ğ) are intentional in user-facing strings/docs.
ignore = ["RUF001", "RUF002", "RUF003", "EXE002", "BLE001", "C408", "ISC004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["geopandas.*", "rasterio.*", "weasyprint.*", "pandas.*",
          "cdsapi.*", "geoalchemy2.*", "apscheduler.*", "skor_motoru.*",
          "psycopg.*", "requests.*", "httpx.*", "jinja2.*", "PIL.*", "shapely.*",
          "planetary_computer.*", "pystac_client.*", "scipy.*", "earthaccess.*", "h5py.*", "h5netcdf.*"]
ignore_missing_imports = true
